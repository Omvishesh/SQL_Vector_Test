name: Deploy Retrieval Services

on:
  push:
    branches:
      - dev
    paths:
      - 'SQL_Retrieval/**'
      - 'Vector_Retrieval/**'

jobs:
  deploy-sql:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create prod.env for SQL
        run: |
          echo "${{ secrets.SQL_ENV }}" > SQL_Retrieval/prod.env

      - name: Deploy SQL Retrieval (Docker)
        working-directory: ./SQL_Retrieval
        run: |
          docker-compose --env-file prod.env down
          docker-compose --env-file prod.env up -d --build

  deploy-vector:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create prod.env for Vector
        run: |
          echo "${{ secrets.VECTOR_ENV }}" > Vector_Retrieval/prod.env

      - name: Deploy Vector Retrieval (Docker)
        working-directory: ./Vector_Retrieval
        run: |
          docker-compose --env-file prod.env down
          docker-compose --env-file prod.env up -d --build
