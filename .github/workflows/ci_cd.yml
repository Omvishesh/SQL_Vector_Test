name: Deploy Retrieval Services

on:
  push:
    branches:
      - dev
    paths:
      - 'SQL_Retrieval/**'
      - 'Vector_Retrieval/**'

jobs:
  deploy-sql:
    if: contains(github.event.head_commit.message, '[sql]')
    runs-on: self-hosted
    steps:
      - name: Update code on VM
        run: |
          cd ~/retrieval
          git fetch origin dev
          git reset --hard origin/dev

      - name: Deploy SQL Retrieval (Docker)
        working-directory: ~/retrieval/SQL_Retrieval
        run: |
          docker-compose --env-file prod.env down
          docker-compose --env-file prod.env up -d --build

  deploy-vector:
    if: contains(github.event.head_commit.message, '[vector]')
    runs-on: self-hosted
    steps:
      - name: Update code on VM
        run: |
          cd ~/retrieval
          git fetch origin dev
          git reset --hard origin/dev

      - name: Deploy Vector Retrieval (Docker)
        working-directory: ~/retrieval/Vector_Retrieval
        run: |
          docker-compose --env-file prod.env down
          docker-compose --env-file prod.env up -d --build
