name: Deploy Retrieval Services

on:
  push:
    branches:
      - dev
    paths:
      - 'SQL_Retrieval/**'
      - 'Vector_Retrieval/**'

jobs:
  deploy-sql:
    runs-on: self-hosted
    if: contains(toJson(github.event.commits.*.modified), 'SQL_Retrieval') || contains(toJson(github.event.commits.*.added), 'SQL_Retrieval') || contains(toJson(github.event.commits.*.removed), 'SQL_Retrieval')
    steps:
      - name: Update code on VM
        run: |
          cd ~/retrieval/code
          git fetch origin dev
          git reset --hard origin/dev

      - name: Deploy SQL Retrieval (Docker)
        working-directory: ~/retrieval/code/SQL_Retrieval
        run: |
          docker-compose --env-file prod.env down
          docker-compose --env-file prod.env up -d --build

  deploy-vector:
    runs-on: self-hosted
    if: contains(toJson(github.event.commits.*.modified), 'Vector_Retrieval') || contains(toJson(github.event.commits.*.added), 'Vector_Retrieval') || contains(toJson(github.event.commits.*.removed), 'Vector_Retrieval')
    steps:
      - name: Update code on VM
        run: |
          cd ~/retrieval/code
          git fetch origin dev
          git reset --hard origin/dev

      - name: Deploy Vector Retrieval (Docker)
        working-directory: ~/retrieval/code.Vector_Retrieval
        run: |
          docker-compose --env-file prod.env down
          docker-compose --env-file prod.env up -d --build
